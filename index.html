<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авто из США</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            padding: 15px;
            margin: 0;
        }
        .filter-card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .car-card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .car-card img { width: 100%; height: 180px; object-fit: cover; }
        .car-info { padding: 12px; }
        .price { color: #10b981; font-weight: bold; font-size: 1.1em; }
        .btn {
            background: var(--tg-theme-button-color, #2563eb);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>🚗 Подбор авто из США</h2>

    <!-- Фильтр бюджета -->
    <div class="filter-card">
        <label for="budget">Ваш бюджет ($):</label>
        <select id="budget" onchange="filterCars()">
            <option value="all">Все варианты</option>
            <option value="15000">До $15,000</option>
            <option value="20000">До $20,000</option>
            <option value="30000">До $30,000</option>
        </select>
    </div>

    <!-- Список авто -->
    <div id="cars-list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // База данных машин (в реальном проекте берется с сервера)
        const cars = [
            { id: 1, name: "Ford Mustang 2019", price: 14500, engine: "2.3L EcoBoost", img: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?w=500" },
            { id: 2, name: "BMW X5 2018", price: 19800, engine: "3.0L Бензин", img: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=500" },
            { id: 3, name: "Tesla Model 3 2021", price: 22000, engine: "Электро", img: "https://images.unsplash.com/photo-1560958089-b8a1929cea89?w=500" }
        ];

        function renderCars(carsToRender) {
            const container = document.getElementById('cars-list');
            container.innerHTML = '';

            carsToRender.forEach(car => {
                container.innerHTML += `
                    <div class="car-card">
                        <img src="${car.img}" alt="${car.name}">
                        <div class="car-info">
                            <h3>${car.name}</h3>
                            <p>Двигатель: ${car.engine}</p>
                            <p class="price">Примерная цена под ключ: $${car.price.toLocaleString()}</p>
                            <button class="btn" onclick="selectCar('${car.name}', ${car.price})">Оставить заявку</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCars() {
            const selectedBudget = document.getElementById('budget').value;
            if (selectedBudget === 'all') {
                renderCars(cars);
            } else {
