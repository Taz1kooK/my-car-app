<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подбор авто из США</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f7);
            color: var(--tg-theme-text-color, #222);
            padding: 15px;
            margin: 0;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .car-card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .car-title {
            font-size: 18px;
            font-weight: bold;
        }
        .car-price {
            font-size: 16px;
            color: #007aff;
            font-weight: 600;
        }
        .btn-select {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-select:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>🚗 Доступные авто под заказ</h2>

    <div class="car-card">
        <div class="car-title">Ford Mustang 2.0 EcoBoost</div>
        <div class="car-price">Цена: $13,500</div>
        <button class="btn-select" onclick="selectCar('Ford Mustang 2.0 EcoBoost', '13500')">Выбрать авто</button>
    </div>

    <div class="car-card">
        <div class="car-title">BMW 320i (G20)</div>
        <div class="car-price">Цена: $18,200</div>
        <button class="btn-select" onclick="selectCar('BMW 320i (G20)', '18200')">Выбрать авто</button>
    </div>

    <div class="car-card">
        <div class="car-title">Audi A5 Sportback</div>
        <div class="car-price">Цена: $21,000</div>
        <button class="btn-select" onclick="selectCar('Audi A5 Sportback', '21000')">Выбрать авто</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем окно на полную высоту

        function selectCar(carName, price) {
            const data = {
                car: carName,
                price: price
            };
            // Отправляем данные обратно боту
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
